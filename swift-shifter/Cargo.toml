[package]
name = "swift-shifter"
version = "1.0.1"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
csv = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif"] }
ravif = "0.11"
rgb = "0.8"
tokio = { version = "1", features = ["full"] }
which = "7"
dirs = "5"
reqwest = { version = "0.12", features = ["stream", "json", "blocking"] }
sha2 = "0.10"
base64 = "0.22"
roxmltree = "0.21"
flate2 = "1"
tar = "0.4"
xz2 = { version = "0.1", features = ["static"] }
zip = "2"
futures-util = "0.3"
lopdf = "0.37"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
comrak = { version = "0.56", default-features = false }
scraper = "0.27"
pulldown-latex = { version = "0.8", default-features = false }
unicode-width = "0.2"
url = "2"
typst = "0.15"
typst-pdf = "0.15"
typst-layout = "0.15"
mitex = "0.2"
# The LaTeX reader's parser, which mitex itself uses.
mitex-parser = "0.2"
unicode-math-class = "0.1"
typst-kit = { version = "0.15", default-features = false, features = ["embedded-fonts", "scan-fonts", "system-files"] }
chrono = "0.4"
sys-locale = "0.3"
lol_html = "3.0.1"

[dev-dependencies]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData"] }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install", "compile"]

[package.metadata.binstall.overrides.'cfg(target_os = "windows")']
pkg-fmt = "zip"

[profile.release]
opt-level = "z"
lto = true
strip = true
