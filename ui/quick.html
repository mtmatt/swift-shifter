<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Swift Shifter</title>
        <!-- Only macOS draws the bar's rounded corners over a transparent
             window. Inline in <head> so it applies before first paint. -->
        <script>
            if (navigator.userAgent.includes("Macintosh")) {
                document.documentElement.dataset.platform = "macos";
            }
        </script>
        <link rel="stylesheet" href="src/quick.css" />
    </head>
    <body>
        <div id="panel">
            <div id="bar">
                <svg id="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.6" />
                    <path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                </svg>
                <input
                    id="query"
                    type="text"
                    role="combobox"
                    aria-autocomplete="list"
                    aria-expanded="false"
                    placeholder="Search files to convert…"
                    aria-label="Search files to convert"
                    aria-controls="results"
                    autocomplete="off"
                    spellcheck="false"
                    autofocus
                />
                <kbd id="hint">esc</kbd>
            </div>
            <ul id="results" role="listbox" aria-label="Recent files"></ul>
            <div id="status" role="status"></div>
        </div>
        <script type="module" src="src/quick.ts"></script>
    </body>
</html>
