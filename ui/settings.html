<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Preferences</title>
        <link rel="stylesheet" href="src/settings.css" />
    </head>
    <body>
        <div class="tab-bar" role="tablist">
            <button class="tab active" role="tab" id="tab-image" data-panel="image" aria-controls="panel-image" aria-selected="true">image</button>
            <button class="tab" role="tab" id="tab-engines" data-panel="engines" aria-controls="panel-engines" aria-selected="false" tabindex="-1">engines</button>
            <button class="tab" role="tab" id="tab-output" data-panel="output" aria-controls="panel-output" aria-selected="false" tabindex="-1">output</button>
            <button class="tab" role="tab" id="tab-quick" data-panel="quick" aria-controls="panel-quick" aria-selected="false" tabindex="-1">quick</button>
            <button class="tab" role="tab" id="tab-appearance" data-panel="appearance" aria-controls="panel-appearance" aria-selected="false" tabindex="-1">theme</button>
        </div>

        <div class="content">

            <!-- ── image ────────────────────────────────────────── -->
            <div class="panel active" id="panel-image" role="tabpanel" aria-labelledby="tab-image">
                <div class="group">
                    <div class="row">
                        <label for="jpeg-q">jpeg</label>
                        <input type="range" id="jpeg-q" min="1" max="100" value="75" />
                        <span id="jpeg-q-val" class="val">75</span>
                    </div>
                    <div class="row">
                        <label for="avif-q">avif</label>
                        <input type="range" id="avif-q" min="1" max="100" value="65" />
                        <span id="avif-q-val" class="val">65</span>
                    </div>
                </div>
            </div>

            <!-- ── engines ──────────────────────────────────────── -->
            <div class="panel" id="panel-engines" role="tabpanel" aria-labelledby="tab-engines">
                <div class="group">
                    <h3 class="subheader">pdf</h3>
                    <div class="row">
                        <label for="use-marker">use marker</label>
                        <input type="checkbox" id="use-marker" />
                    </div>
                    <div class="row" id="marker-hint" hidden>
                        <span id="marker-status" class="hint"></span>
                    </div>
                </div>
            </div>

            <!-- ── output ───────────────────────────────────────── -->
            <div class="panel" id="panel-output" role="tabpanel" aria-labelledby="tab-output">
                <div class="group">
                    <div class="row">
                        <label for="clipboard-mode">paste output</label>
                        <select id="clipboard-mode" class="text-input">
                            <option value="clipboard">copy to clipboard</option>
                            <option value="download">download to file</option>
                        </select>
                    </div>
                    <div class="row">
                        <label for="max-c">workers</label>
                        <input type="range" id="max-c" min="1" max="8" value="4" />
                        <span id="max-c-val" class="val">4</span>
                    </div>
                </div>
            </div>

            <!-- ── appearance ───────────────────────────────────── -->
            <div class="panel" id="panel-appearance" role="tabpanel" aria-labelledby="tab-appearance">
                <div class="group">
                    <div class="row">
                        <label for="appearance">theme</label>
                        <select id="appearance" class="text-input">
                            <option value="system">follow system</option>
                            <option value="light">light</option>
                            <option value="dark">dark</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- ── quick bar ────────────────────────────────────── -->
            <div class="panel" id="panel-quick" role="tabpanel" aria-labelledby="tab-quick">
                <div class="group">
                    <div class="row">
                        <label id="shortcut-label">shortcut</label>
                        <button
                            id="btn-shortcut"
                            class="shortcut-btn"
                            aria-labelledby="shortcut-label btn-shortcut"
                            aria-describedby="shortcut-hint"
                            disabled
                        >…</button>
                    </div>
                    <p id="shortcut-hint" class="hint hint--warn" aria-live="polite">click to change</p>

                    <h3 class="subheader">recent files from</h3>
                    <ul id="folder-list" class="folder-list" aria-label="Folders the quick bar scans"></ul>
                    <p id="folder-empty" class="hint hint--warn" hidden>no folders · the quick bar will show nothing</p>
                    <div class="row folder-actions">
                        <button id="btn-add-folder" class="btn-inline" disabled>add folder…</button>
                        <button id="btn-reset-folders" class="btn-inline" disabled>restore defaults</button>
                    </div>
                </div>
            </div>

        </div>

        <footer>
            <span id="status" role="status"></span>
            <button id="btn-cancel">cancel</button>
            <button id="btn-save" disabled>save</button>
        </footer>

        <script type="module" src="src/settings.ts"></script>
    </body>
</html>
