name: Build
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [main, release]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Ubuntu
          - os: ubuntu-latest
            name: Fedora
            container: fedora:latest
          - os: ubuntu-latest
            name: Arch
            container: archlinux:latest

    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - name: Install Ubuntu system dependencies
        if: matrix.name == 'Ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            nasm

      - name: Install Fedora system dependencies
        if: matrix.name == 'Fedora'
        run: |
          dnf install -y \
            git curl tar gzip findutils file \
            gcc gcc-c++ make \
            webkit2gtk4.1-devel \
            gtk3-devel \
            libayatana-appindicator-gtk3-devel \
            librsvg2-devel \
            patchelf \
            openssl-devel \
            nasm

      - name: Install Arch system dependencies
        if: matrix.name == 'Arch'
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            git curl \
            base-devel \
            webkit2gtk-4.1 \
            gtk3 \
            libayatana-appindicator \
            librsvg \
            patchelf \
            openssl \
            nasm

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ matrix.container == '' && 'npm' || '' }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: swift-shifter

      - name: Check version files agree
        if: matrix.name == 'Ubuntu'
        run: scripts/check-version.sh

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Rust format check
        if: matrix.name == 'Ubuntu'
        working-directory: swift-shifter
        run: cargo fmt --check

      # Per OS, since each compiles different cfg-gated code. Needs the
      # frontend built first: tauri's generate_context! embeds ui/dist.
      - name: Clippy
        working-directory: swift-shifter
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Tauri app (compile check, no bundle)
        run: npm run tauri -- build --no-bundle

  # The whole cargo test suite (#108), beside the build, as TeX Live takes
  # a while to install. With the tools it installs, the LaTeX writer's
  # output is compiled with each engine (#78) and the EPUB writer's books
  # are checked with epubcheck (#79); in CI, those tests fail rather than
  # skip without them.
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Install system dependencies, TeX Live and epubcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            nasm \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-plain-generic \
            texlive-xetex \
            texlive-luatex \
            texlive-lang-cjk \
            texlive-lang-japanese \
            fonts-noto-cjk \
            lmodern \
            epubcheck

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: swift-shifter

      # tauri's generate_context! embeds ui/dist.
      - name: Build frontend
        run: |
          npm ci
          npm run build

      # The tests that use the system clipboard are macOS's only, so none
      # run here.
      - name: Run the tests
        working-directory: swift-shifter
        run: cargo test
