name: Build
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [main, release]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Ubuntu
          - os: ubuntu-latest
            name: Fedora
            container: fedora:latest
          - os: ubuntu-latest
            name: Arch
            container: archlinux:latest

    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - name: Install Ubuntu system dependencies
        if: matrix.name == 'Ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            nasm \
            epubcheck

      - name: Install Fedora system dependencies
        if: matrix.name == 'Fedora'
        run: |
          dnf install -y \
            git curl tar gzip findutils file \
            gcc gcc-c++ make \
            webkit2gtk4.1-devel \
            gtk3-devel \
            libayatana-appindicator-gtk3-devel \
            librsvg2-devel \
            patchelf \
            openssl-devel \
            nasm

      - name: Install Arch system dependencies
        if: matrix.name == 'Arch'
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            git curl \
            base-devel \
            webkit2gtk-4.1 \
            gtk3 \
            libayatana-appindicator \
            librsvg \
            patchelf \
            openssl \
            nasm

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ matrix.container == '' && 'npm' || '' }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: swift-shifter

      - name: Check version files agree
        if: matrix.name == 'Ubuntu'
        run: scripts/check-version.sh

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Rust format check
        if: matrix.name == 'Ubuntu'
        working-directory: swift-shifter
        run: cargo fmt --check

      # Per OS, since each compiles different cfg-gated code. Needs the
      # frontend built first: tauri's generate_context! embeds ui/dist.
      - name: Clippy
        working-directory: swift-shifter
        run: cargo clippy --all-targets -- -D warnings

      # The EPUB writer's books against the EPUB 3 specification (#79).
      # Only this test: the suite as a whole isn't run in CI.
      - name: Check EPUB output with epubcheck
        if: matrix.name == 'Ubuntu'
        working-directory: swift-shifter
        run: cargo test --bin swift-shifter books_pass_epubcheck -- --nocapture

      - name: Build Tauri app (compile check, no bundle)
        run: npm run tauri -- build --no-bundle

  # The LaTeX writer's output compiled with pdfLaTeX and LuaLaTeX (#78),
  # beside the build, as TeX Live takes a while to install.
  latex:
    name: LaTeX engines
    runs-on: ubuntu-latest

    steps:
      - name: Install system dependencies and TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            nasm \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-plain-generic \
            texlive-luatex \
            texlive-lang-japanese \
            lmodern

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: swift-shifter

      # tauri's generate_context! embeds ui/dist.
      - name: Build frontend
        run: |
          npm ci
          npm run build

      # The tests that compile LaTeX, by name: the suite as a whole isn't
      # run in CI. A new one is to be added here.
      - name: Compile LaTeX output with each engine
        working-directory: swift-shifter
        run: >
          cargo test --bin swift-shifter --
          raw_html_in_latex_output_keeps_the_main_texts_ids_and_copies_its_images
          our_latex_compiles
          quotes_nested_past_the_latex_list_limit_compile
          quotes_nested_thirty_deep_keep_a_readable_line
          typst_math_latex_compiles
          typst_math_symbols_have_latex_glyphs
          colon_equals_is_one_symbol_in_html_and_compiles_in_latex
          colon_equals_is_defined_for_latex_beside_the_documents_own
          typst_operators_and_strings_are_spaced_as_typst_sets_them
          script_characters_with_scripts_compile_in_latex
          unbraced_and_verbatim_text_in_math_compiles_in_latex
          negated_relations_and_variation_selectors_get_latex_names
          colon_equals_is_defined_for_nested_math_and_provided_commands
          notes_inside_notes_are_typeset_in_order
          notes_where_latex_cant_set_them_are_set_after
          cjk_documents_keep_the_spaces_beside_english_punctuation
