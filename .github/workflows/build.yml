name: Build
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [main, release]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Ubuntu
          - os: ubuntu-latest
            name: Fedora
            container: fedora:latest
          - os: ubuntu-latest
            name: Arch
            container: archlinux:latest

    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      # Ubuntu's system dependencies, installed as the Tests job installs its
      # own (see there).
      APT_PACKAGES: >-
        libwebkit2gtk-4.1-dev
        libgtk-3-dev
        libayatana-appindicator3-dev
        librsvg2-dev
        patchelf
        nasm

    steps:
      - name: Key the cache of apt's downloads
        if: matrix.name == 'Ubuntu'
        id: apt-key
        run: &apt-key |
          # The runner image's Ubuntu and the packages installed, and the
          # month: a cache can't be updated, so a new one each month keeps
          # the packages updated since. It starts from the last month's.
          prefix="apt-$ImageOS-$(printf %s "$APT_PACKAGES" | sha256sum | cut -c1-16)-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore apt's downloads
        if: matrix.name == 'Ubuntu'
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-key.outputs.key }}
          restore-keys: ${{ steps.apt-key.outputs.prefix }}

      # A mirror can be slow rather than down, which apt's own retries don't
      # catch: past 8 minutes, downloading is given up on, and the next try
      # goes to Ubuntu's own mirror in place of the runner's. Only then is
      # anything installed. A restored cache's downloads are used where
      # they're the versions the index lists.
      - name: Install Ubuntu system dependencies
        if: matrix.name == 'Ubuntu'
        timeout-minutes: 26
        run: &apt-install |
          if [ -d ~/apt-archives ]; then
            sudo find ~/apt-archives -name '*.deb' -exec mv -t /var/cache/apt/archives {} +
          fi
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              echo "::warning::apt download $((attempt - 1)) failed or took over 8 minutes; trying archive.ubuntu.com"
              for sources in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
                if [ -f "$sources" ]; then
                  sudo sed -i -E \
                    -e 's#https?://azure\.archive\.ubuntu\.com/ubuntu/?#http://archive.ubuntu.com/ubuntu/#g' \
                    -e 's#mirror\+file:/etc/apt/apt-mirrors\.txt#http://archive.ubuntu.com/ubuntu/#g' \
                    "$sources"
                fi
              done
            fi
            if timeout -k 30s 8m bash -c 'sudo apt-get update && sudo apt-get install -y \
                --download-only -o Acquire::Retries=3 -o Acquire::http::Timeout=60 \
                $APT_PACKAGES'; then
              break
            elif [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
          sudo apt-get install -y -o APT::Keep-Downloaded-Packages=true $APT_PACKAGES

      # Only the downloads, not apt's lock or partial/, and as the runner's,
      # which the cache saves as; not those of versions the index no longer
      # lists, which a cache from an earlier month may hold.
      - name: Keep apt's downloads
        if: matrix.name == 'Ubuntu' && steps.apt-cache.outputs.cache-hit != 'true'
        run: &apt-keep |
          sudo apt-get autoclean
          mkdir -p ~/apt-archives
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/apt-archives {} +
          du -sh ~/apt-archives

      - name: Save apt's downloads
        if: matrix.name == 'Ubuntu' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-key.outputs.key }}

      - name: Install Fedora system dependencies
        if: matrix.name == 'Fedora'
        run: |
          dnf install -y \
            git curl tar gzip findutils file \
            gcc gcc-c++ make \
            webkit2gtk4.1-devel \
            gtk3-devel \
            libayatana-appindicator-gtk3-devel \
            librsvg2-devel \
            patchelf \
            openssl-devel \
            nasm

      - name: Install Arch system dependencies
        if: matrix.name == 'Arch'
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            git curl \
            base-devel \
            webkit2gtk-4.1 \
            gtk3 \
            libayatana-appindicator \
            librsvg \
            patchelf \
            openssl \
            nasm

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ matrix.container == '' && 'npm' || '' }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: swift-shifter

      - name: Check version files agree
        if: matrix.name == 'Ubuntu'
        run: scripts/check-version.sh

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Rust format check
        if: matrix.name == 'Ubuntu'
        working-directory: swift-shifter
        run: cargo fmt --check

      # Per OS, since each compiles different cfg-gated code. Needs the
      # frontend built first: tauri's generate_context! embeds ui/dist.
      - name: Clippy
        working-directory: swift-shifter
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Tauri app (compile check, no bundle)
        run: npm run tauri -- build --no-bundle

  # The whole cargo test suite (#108), beside the build, as TeX Live takes
  # a while to install. It installs the tools tests check output with:
  # TeX Live's engines (#78), epubcheck (#79), pandoc, pdftotext and
  # pymupdf4llm (#114). In CI, a test fails rather than skip without one.
  # Not tectonic: it downloads its bundle while the tests run, and TeX
  # Live's XeLaTeX compiles our LaTeX already. On the Ubuntu its tools are
  # known to install on, as `ubuntu-latest` moves to Ubuntu 26. apt's
  # downloads are cached, keyed by the runner's Ubuntu and the packages,
  # and a slow mirror is given up on (see the Ubuntu build). Past 40
  # minutes, a run is stuck: three tries at downloading take up to 24.
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      APT_PACKAGES: >-
        libwebkit2gtk-4.1-dev
        libgtk-3-dev
        libayatana-appindicator3-dev
        librsvg2-dev
        nasm
        texlive-latex-recommended
        texlive-latex-extra
        texlive-plain-generic
        texlive-xetex
        texlive-luatex
        texlive-lang-cjk
        texlive-lang-japanese
        fonts-noto-cjk
        lmodern
        epubcheck
        pandoc
        poppler-utils
        xvfb

    steps:
      - name: Key the cache of apt's downloads
        id: apt-key
        run: *apt-key

      - name: Restore apt's downloads
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-key.outputs.key }}
          restore-keys: ${{ steps.apt-key.outputs.prefix }}

      - name: Install system dependencies and the tools tests check with
        timeout-minutes: 26
        run: *apt-install

      - name: Keep apt's downloads
        if: steps.apt-cache.outputs.cache-hit != 'true'
        run: *apt-keep

      - name: Save apt's downloads
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-key.outputs.key }}

      # Where the app looks for it first; pinned to the version tested.
      - name: Install pymupdf4llm
        run: pipx install --include-deps pymupdf4llm==1.27.2.3

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: swift-shifter

      # tauri's generate_context! embeds ui/dist.
      - name: Build frontend
        run: |
          npm ci
          npm run build

      # The tests that use the system clipboard are macOS's only, so none
      # run here. The CLI tests' headless app still starts GTK, which needs
      # a display: xvfb gives it one.
      - name: Run the tests
        working-directory: swift-shifter
        run: xvfb-run -a cargo test
